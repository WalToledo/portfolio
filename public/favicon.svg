<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
    <defs>
        <linearGradient id="wt-bg" x1="0%" y1="42%" x2="100%" y2="58%">
            <stop class="stop-1" offset="0%" stop-color="#1d4ed8" />
            <stop class="stop-2" offset="45%" stop-color="#2563eb" />
            <stop class="stop-3" offset="100%" stop-color="#0284c7" />
        </linearGradient>
    </defs>
    <rect width="32" height="32" rx="9" fill="url(#wt-bg)" />
    <text
        x="16"
        y="17.5"
        text-anchor="middle"
